spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=user-service-auth
spring.cloud.gateway.server.webflux.routes[0].uri=http://user-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service-users
spring.cloud.gateway.server.webflux.routes[1].uri=http://user-service:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://product-service:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/products/**

spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://order-service:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/orders/**

management.endpoints.web.exposure.include=health,info,gateway

jwt.secret = ${jwt.secret}